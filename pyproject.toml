[project]
name = "astrbot-plugin-game-torrent"
version = "0.1.0"
description = "AstrBot 游戏资源搜索插件"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "pydantic>=2,<3", "qrcode[pil]>=8,<9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
