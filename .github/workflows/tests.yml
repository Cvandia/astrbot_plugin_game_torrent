name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff pyyaml
      - run: pip install --no-deps astrbot==4.17.0
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
